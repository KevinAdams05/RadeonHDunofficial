<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>Where 2D and 3D acceleration stop on Haiku today</title>
  <desc>Two stacks. Left: the 2D path from app_server through the accelerant to hardware, where the break is that app_server deliberately removed its consumer of the optional 2D hooks in commit 03f77fd7d9 (November 2024). Right: the 3D path from Mesa down, where the break is that Haiku has no DRM-equivalent kernel subsystem for a winsys to target.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a3a42"/>
    </marker>
  </defs>

  <style>
    .ttl  { font-size: 16px; font-weight: 700; fill: #16161a; }
    .sub  { font-size: 11px; fill: #6a6a74; }
    .colh { font-size: 14px; font-weight: 700; fill: #16161a; }
    .panel{ fill: #f5f5f7; stroke: #cfcfd6; stroke-width: 1; rx: 8; }
    .ok   { fill: #eef7ee; stroke: #2a7a2a; stroke-width: 1.5; rx: 5; }
    .miss { fill: #fdeeee; stroke: #b3261e; stroke-width: 2; rx: 5; stroke-dasharray: 7 4; }
    .part { fill: #fff6e0; stroke: #d08c00; stroke-width: 1.5; rx: 5; }
    .hw   { fill: #eef4fd; stroke: #1a5fb4; stroke-width: 1.5; rx: 5; }
    .tb   { font-size: 12.5px; font-weight: 600; fill: #1a1a1a; }
    .t    { font-size: 11.5px; fill: #33333b; }
    .tm   { font-size: 11px; fill: #4a4a54; font-family: "DejaVu Sans Mono", monospace; }
    .ln   { stroke: #3a3a42; stroke-width: 1.6; fill: none; marker-end: url(#ar); }
    .brk  { stroke: #b3261e; stroke-width: 2.5; fill: none; }
    .brkt { font-size: 11.5px; font-weight: 700; fill: #b3261e; }
    .leg  { font-size: 11px; fill: #3a3a42; }
  </style>

  <text class="ttl" x="530" y="26" text-anchor="middle">Where acceleration stops on Haiku today</text>
  <text class="sub" x="530" y="44" text-anchor="middle">In both stacks the driver is not the blocker. Verified against Haiku 366aed0f87 and haikuports 2026-08-04.</text>

  <rect class="panel" x="18"  y="58" width="504" height="560"/>
  <rect class="panel" x="538" y="58" width="504" height="560"/>

  <text class="colh" x="38"  y="82">2D acceleration</text>
  <text class="sub"  x="38"  y="99">API exists since BeOS · hooks marked /* optional */</text>

  <text class="colh" x="558" y="82">3D acceleration</text>
  <text class="sub"  x="558" y="99">Mesa's Haiku platform already works</text>

  <!-- ── 2D stack ────────────────────────────────────────── -->
  <rect class="ok" x="38" y="112" width="464" height="44"/>
  <text class="tb" x="52" y="131">app / BView drawing</text>
  <text class="t"  x="52" y="148">unchanged — apps need no new API</text>

  <rect class="ok" x="38" y="166" width="464" height="52"/>
  <text class="tb" x="52" y="185">app_server — Painter (AGG, CPU)</text>
  <text class="tm" x="52" y="202">drawing/Painter/Painter.h:15</text>
  <text class="t"  x="52" y="214">all rendering happens here, on the CPU</text>

  <rect class="miss" x="38" y="228" width="464" height="74"/>
  <text class="tb"  x="52" y="248">AccelerantHWInterface — consumer REMOVED in 2024</text>
  <text class="tm"  x="52" y="265">AccelerantHWInterface.h:116-142  (no fill/blit member)</text>
  <text class="tm"  x="52" y="281">fEngineToken = NULL, never used  (.cpp:105)</text>
  <text class="tm"  x="52" y="296">commit 03f77fd7d9 — deliberate, reviewed, -467 lines</text>

  <path class="brk" d="M 30 314 L 510 314"/>
  <text class="brkt" x="52" y="332">THE BREAK — removed on purpose, not unfinished</text>

  <rect class="part" x="38" y="342" width="464" height="46"/>
  <text class="tb" x="52" y="361">Accelerant 2D hook API</text>
  <text class="tm" x="52" y="378">B_SCREEN_TO_SCREEN_BLIT · B_FILL_RECTANGLE · …  (Accelerant.h:73-77)</text>

  <rect class="miss" x="38" y="398" width="464" height="70"/>
  <text class="tb" x="52" y="417">radeon_hd — hooks commented out (most drivers HAVE them)</text>
  <text class="tm" x="52" y="434">hooks.cpp:78-85 · named functions never written</text>
  <text class="t"  x="52" y="451">engine hooks ARE live — but they are a lock,</text>
  <text class="t"  x="52" y="463">not a GPU engine (engine.cpp:34-64)</text>

  <rect class="miss" x="38" y="478" width="464" height="52"/>
  <text class="tb" x="52" y="497">ring / CP bring-up — stubbed</text>
  <text class="tm" x="52" y="514">radeon_gpu_ring_boot() returns before its body (TODO 10)</text>

  <rect class="hw" x="38" y="540" width="464" height="40"/>
  <text class="tb" x="52" y="565">GPU 2D blitter</text>

  <text class="t" x="38" y="596">matrox, neomagic, nvidia, radeon, via all</text>
  <text class="t" x="38" y="610">implement these hooks — all dead paths now</text>

  <!-- ── 3D stack ────────────────────────────────────────── -->
  <rect class="ok" x="558" y="112" width="464" height="44"/>
  <text class="tb" x="572" y="131">app / OpenGL Kit (BGLView)</text>
  <text class="t"  x="572" y="148">works today — software rendered</text>

  <rect class="ok" x="558" y="166" width="464" height="52"/>
  <text class="tb" x="572" y="185">Mesa — Haiku platform glue</text>
  <text class="tm" x="572" y="202">-Dplatforms=haiku -Degl=enabled</text>
  <text class="t"  x="572" y="214">exists and works; this part is done</text>

  <rect class="part" x="558" y="228" width="464" height="52"/>
  <text class="tb" x="572" y="247">gallium: llvmpipe + lavapipe (CPU only)</text>
  <text class="tm" x="572" y="264">mesa-25.3.3.recipe:113-116 — no hardware driver built</text>

  <rect class="part" x="558" y="290" width="464" height="52"/>
  <text class="tb" x="572" y="309">gallium r600 / radeonsi exist upstream, MIT</text>
  <text class="t"  x="572" y="326">r600 = TeraScale · radeonsi = GCN — just not enabled</text>

  <rect class="miss" x="558" y="352" width="464" height="46"/>
  <text class="tb" x="572" y="371">winsys — would have to be written</text>
  <text class="t"  x="572" y="388">Mesa's amdgpu winsys is DRM-ioctl specific</text>

  <path class="brk" d="M 550 410 L 1030 410"/>
  <text class="brkt" x="572" y="428">THE BREAK — there is nothing to talk to</text>

  <rect class="miss" x="558" y="438" width="464" height="92"/>
  <text class="tb" x="572" y="457">no DRM equivalent in Haiku</text>
  <text class="t"  x="572" y="475">no GPU memory manager (no GEM / TTM)</text>
  <text class="t"  x="572" y="491">no command-submission ioctl</text>
  <text class="t"  x="572" y="507">no GPU fences / sync objects</text>
  <text class="tm" x="572" y="524">only headers/private/graphics/AGP.h (GART)</text>

  <rect class="hw" x="558" y="540" width="464" height="40"/>
  <text class="tb" x="572" y="565">GPU shader cores</text>

  <text class="t" x="558" y="600">Kernel half is GPL-2.0 upstream — reference only; userspace half is MIT and reusable</text>

  <!-- flow arrows -->
  <path class="ln" d="M 270 156 L 270 162"/>
  <path class="ln" d="M 270 218 L 270 224"/>
  <path class="ln" d="M 270 388 L 270 394"/>
  <path class="ln" d="M 270 468 L 270 474"/>
  <path class="ln" d="M 270 530 L 270 536"/>
  <path class="ln" d="M 790 156 L 790 162"/>
  <path class="ln" d="M 790 218 L 790 224"/>
  <path class="ln" d="M 790 280 L 790 286"/>
  <path class="ln" d="M 790 342 L 790 348"/>
  <path class="ln" d="M 790 530 L 790 536"/>

  <!-- legend -->
  <rect class="panel" x="18" y="632" width="1024" height="52"/>
  <rect class="ok"   x="38"  y="646" width="16" height="16"/><text class="leg" x="62"  y="659">present and working</text>
  <rect class="part" x="230" y="646" width="16" height="16"/><text class="leg" x="254" y="659">exists but not wired up / CPU only</text>
  <rect class="miss" x="520" y="646" width="16" height="16"/><text class="leg" x="544" y="659">missing — would have to be built</text>
  <rect class="hw"   x="800" y="646" width="16" height="16"/><text class="leg" x="824" y="659">hardware</text>
</svg>
